function loadSlots(){slot='';var d=$('bDate').value,dc=$('bDoc').value;if(!d||!dc){$('slots').textContent=t('pickT');return}
 quiet('getAvailableSlots',dc,d).then(function(r){$('slots').innerHTML=r.success&&r.data.slots.length?r.data.slots.map(function(x){return '<button type="button" class="slot">'+x+'</button>'}).join(''):t('noSlot')})}
$('bDate').onchange=$('bDoc').onchange=loadSlots;
$('bf').onsubmit=function(e){e.preventDefault();if(!slot)return toast(t('fTime'));
 call('createAppointment',{name:$('bName').value,phone:$('bPhone').value,whatsapp:$('bWa').value,email:$('bMail').value,lang:L,gender:$('bGen').value,dob:$('bDob').value,serviceId:$('bSvc').value,doctorId:$('bDoc').value,date:$('bDate').value,time:slot,reason:$('bReason').value,consent:$('bCons').checked,website:$('bHp').value}).then(function(r){
 if(!r.success)return toast(r.message);var d=r.data,m=(L=='ar'?'رقم حجزي: ':'My booking reference: ')+d.BookingID;
 $('bf').style.display='none';$('done').innerHTML='<div class="ok"><div class="ck">✓</div><h3>'+t('booked')+'</h3><p><b>'+esc(d.BookingID)+'</b><br>'+esc(d.PatientName)+' · '+esc(d.ServiceName)+'<br>'+esc(d.DoctorName)+' · '+esc(d.AppointmentDate)+' '+esc(d.AppointmentTime)+'</p><p class="note">'+t('pay')+'</p><a class="btn sm" target="_blank" rel="noopener" href="'+esc(link('wa',m))+'">WhatsApp</a> <a class="btn o sm" target="_blank" rel="noopener" href="'+esc(link('tg'))+'">Telegram</a> <button class="btn o sm" onclick="print()">'+t('print')+'</button> <button class="btn o sm" onclick="location.reload()">'+t('another')+'</button></div>'})};
$('lf').onsubmit=function(e){e.preventDefault();var ref=$('lRef').value,ph=$('lPh').value;call('getAppointmentByReference',ref,ph).then(function(r){
 if(!r.success){$('lres').innerHTML='';return toast(r.message)}var d=r.data;$('lres').innerHTML='<div class="ok" style="text-align:start"><b>'+esc(d.BookingID)+'</b> — '+esc(d.Status)+'<br>'+esc(d.ServiceName)+' · '+esc(d.DoctorName)+' · '+esc(d.AppointmentDate)+' '+esc(d.AppointmentTime)+'<div class="bar"><button class="btn o sm" id="xc">'+t('cancel')+'</button><button class="btn o sm" id="xr">'+t('resch')+'</button></div></div>';
 $('xc').onclick=function(){call('cancelAppointment',ref,ph,'').then(function(x){toast(x.message);$('lf').onsubmit(new Event('s'))})};
 $('xr').onclick=function(){var n=prompt(t('resch'));if(n)call('requestReschedule',ref,ph,n).then(function(x){toast(x.message)})}})};
$('cf').onsubmit=function(e){e.preventDefault();call('submitContactMessage',{name:$('cN').value,phone:$('cP').value,email:$('cE').value,subject:$('cS').value,message:$('cM').value,website:$('cH').value}).then(function(r){toast(r.success?t('sent'):r.message);if(r.success)$('cf').reset()})};
function bot(m,c){var d=document.createElement('div');d.className='mg '+c;d.textContent=m;$('msgs').appendChild(d);$('msgs').scrollTop=1e9;return d}
function ask(q){q=q.trim();if(!q)return;bot(q,'u');$('bin').value='';var w=bot('…','b');quiet('askChatbot',q,L).then(function(r){w.textContent=r.success?r.data.answer:r.message})}
$('bsend').onclick=function(){ask($('bin').value)};$('bin').onkeydown=function(e){if(e.key=='Enter')ask(this.value)};
$('botb').onclick=function(){$('botw').classList.toggle('open')};$('botx').onclick=$('botm').onclick=function(){$('botw').classList.remove('open')};
$('lang').onclick=function(){L=L=='ar'?'en':'ar';applyLang()};
$('burger').onclick=function(){$('links').classList.toggle('open')};$('links').onclick=function(e){if(e.target.tagName=='A')this.classList.remove('open')};
// Admin
function showAdmin(on){$('admin').style.display=on?'block':'none';$('site').style.display=on?'none':'block'}
$('adminLink').onclick=function(e){e.preventDefault();showAdmin(true)};$('aBack').onclick=function(){showAdmin(false)};
$('alog').onsubmit=function(e){e.preventDefault();call('adminLogin',$('apw').value).then(function(r){$('apw').value='';if(!r.success)return toast(r.message);tok=r.data.token;$('alog').style.display='none';$('adash').style.display='block';loadAdmin()})};
$('aOut').onclick=function(){if(tok)quiet('adminLogout',tok);tok=null;$('adash').style.display='none';$('alog').style.display='block'};
function loadAdmin(){call('getDashboardStats',tok).then(function(r){if(!r.success)return toast(r.message);var d=r.data,k={Total:d.total,Pending:d.pending,Confirmed:d.confirmed,Completed:d.completed,Cancelled:d.cancelled,Patients:d.patients,Products:d.products,'New messages':d.newMessages};
 $('stats').innerHTML=Object.keys(k).map(function(n){return '<div class="card"><span class="stat">'+k[n]+'</span>'+n+'</div>'}).join('')});
 call('getAllAppointments',tok).then(function(r){if(!r.success)return toast(r.message);A=r.data.items;
 $('at').innerHTML='<tr><th>ID</th><th>Patient</th><th>Phone</th><th>Service</th><th>Doctor</th><th>When</th><th>Status</th><th></th></tr>'+A.map(function(a){return '<tr><td>'+esc(a.BookingID)+'</td><td>'+esc(a.PatientName)+'</td><td>'+esc(a.Phone)+'</td><td>'+esc(a.ServiceName)+'</td><td>'+esc(a.DoctorName)+'</td><td>'+esc(a.AppointmentDate+' '+a.AppointmentTime)+'</td><td>'+esc(a.Status)+'</td><td><select data-id="'+esc(a.BookingID)+'"><option value="">…</option>'+['Confirmed','Rejected','Cancelled','Completed','No Show'].map(function(s){return '<option>'+s+'</option>'}).join('')+'</select></td></tr>'}).join('')})}
$('at').onchange=function(e){var s=e.target;if(s.dataset.id&&s.value)call('updateAppointmentStatus',tok,s.dataset.id,s.value,'').then(function(r){toast(r.message);loadAdmin()})};
$('csv').onclick=function(){var h=Object.keys(A[0]||{});var c=[h.join(',')].concat(A.map(function(a){return h.map(function(k){return '"'+String(a[k]).replace(/"/g,'""')+'"'}).join(',')})).join('\n');var l=document.createElement('a');l.href=URL.createObjectURL(new Blob(['\ufeff'+c],{type:'text/csv'}));l.download='appointments.csv';l.click()};
// Boot
$('h1').src=PHOTOS.hero1||IMG.a;$('h2').src=PHOTOS.hero2||IMG.b;$('ab1').src=PHOTOS.about1||IMG.b;$('ab2').src=PHOTOS.about2||IMG.a;
applyLang();
quiet('getPublicData').then(function(r){if(!r.success)return toast(r.message);D=r.data;if(!localStorage.getItem('lang')&&D.settings.DefaultLanguage&&D.settings.DefaultLanguage!=L){L=D.settings.DefaultLanguage;applyLang()}setting();renderAll()});
</script>
